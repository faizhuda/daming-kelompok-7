data:
  pollutant_cols:
    - 'pm10'
    - 'pm2_5'
    - 'carbon_monoxide'
    - 'nitrogen_dioxide'
    - 'sulphur_dioxide'
    - 'ozone'
  carbon_dioxide_col: 'carbon_dioxide'
  aqi_col: 'aqi'
  city_id_col: 'city_id'
  datetime_col: 'datetime'

cleaning:
  winsorize_limits:
    - 0.01
    - 0.99

features:
  lags:
    - 1
    - 3
    - 6
    - 24
  rolling_windows:
    - 3
    - 6
    - 24

models:
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

visualization:
  plot_sample_size: 500   # max data points shown in prediction time-series plot
